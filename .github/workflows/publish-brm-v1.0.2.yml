name: Publish BRM v1.0.2 release

on:
  push:
    branches:
      - brm-v1.0.2
    paths:
      - .github/workflows/publish-brm-v1.0.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/brm-v1.0.2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BRM_reproducibility_v1/requirements.txt

      - name: Build validated v1.0.2 archival asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage verify previous.zip BRM_reproducibility_v1_v1.0.2.zip
          mkdir -p stage

          # Reuse the already validated full Monte Carlo outputs from v1.0.1,
          # then overlay every current v1.0.2 code/metadata/empirical file.
          gh release download brm-v1.0.1 \
            --pattern 'BRM_reproducibility_v1_v1.0.1.zip' \
            --output previous.zip
          unzip -q previous.zip -d stage
          rsync -a BRM_reproducibility_v1/ stage/BRM_reproducibility_v1/ \
            --exclude RELEASE_ASSET_SHA256.txt

          python -m pip install -r stage/BRM_reproducibility_v1/requirements.txt
          python -m py_compile stage/BRM_reproducibility_v1/*.py
          python stage/BRM_reproducibility_v1/validate_brm_outputs.py --root stage/BRM_reproducibility_v1
          python stage/BRM_reproducibility_v1/validate_empirical_audit.py --root stage/BRM_reproducibility_v1
          python stage/BRM_reproducibility_v1/make_empirical_figure.py --root stage/BRM_reproducibility_v1 --out /tmp/figure6_empirical_check.png

          (
            cd stage/BRM_reproducibility_v1
            rm -f SHA256SUMS.txt RELEASE_ASSET_SHA256.txt
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('stage/BRM_reproducibility_v1')
          out = Path('BRM_reproducibility_v1_v1.0.2.zip')
          stamp = (2026, 9, 7, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              root_info = zipfile.ZipInfo('BRM_reproducibility_v1/', stamp)
              root_info.external_attr = (0o40755 << 16) | 0x10
              zf.writestr(root_info, b'')
              for p in sorted(root.rglob('*'), key=lambda x: x.as_posix()):
                  arc = 'BRM_reproducibility_v1/' + p.relative_to(root).as_posix()
                  if p.is_dir():
                      info = zipfile.ZipInfo(arc.rstrip('/') + '/', stamp)
                      info.external_attr = (0o40755 << 16) | 0x10
                      zf.writestr(info, b'')
                  else:
                      info = zipfile.ZipInfo(arc, stamp)
                      mode = 0o755 if p.suffix == '.py' else 0o644
                      info.external_attr = (0o100000 | mode) << 16
                      zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY

          unzip -t BRM_reproducibility_v1_v1.0.2.zip
          mkdir verify
          unzip -q BRM_reproducibility_v1_v1.0.2.zip -d verify
          python verify/BRM_reproducibility_v1/validate_brm_outputs.py --root verify/BRM_reproducibility_v1
          python verify/BRM_reproducibility_v1/validate_empirical_audit.py --root verify/BRM_reproducibility_v1
          (cd verify/BRM_reproducibility_v1 && sha256sum -c SHA256SUMS.txt)

          SHA=$(sha256sum BRM_reproducibility_v1_v1.0.2.zip | awk '{print $1}')
          echo "ASSET_SHA=$SHA" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$SHA" 'BRM_reproducibility_v1_v1.0.2.zip' > BRM_reproducibility_v1/RELEASE_ASSET_SHA256.txt

      - name: Commit final outer checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BRM_reproducibility_v1/RELEASE_ASSET_SHA256.txt
          git commit -m 'Finalize BRM v1.0.2 release checksum'
          git push origin HEAD:refs/heads/brm-v1.0.2
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Reproducibility snapshot for *From Group Nulls to Person-Specific Recovery: Statistical Cancellation, Signal Availability, and Design in Intensive Longitudinal Research*.

          Version 1.0.2 is the submission-aligned reproducibility release for the current Behavior Research Methods resubmission. It preserves the validated numerical outputs while adding audited empirical pipelines, derived non-identifying empirical audit outputs, empirical-anchor validation, corrected ICC(C,1) terminology, and hardened archival metadata.

          Public OSF project: https://osf.io/4u6dk/

          Raw mcPHASES data are not redistributed because PhysioNet access is credentialed.

          Release asset: BRM_reproducibility_v1_v1.0.2.zip

          SHA-256: ${ASSET_SHA}
          EOF

          gh release delete brm-v1.0.2 --cleanup-tag --yes || true
          gh release create brm-v1.0.2 \
            BRM_reproducibility_v1_v1.0.2.zip \
            --target "$RELEASE_TARGET" \
            --title 'BRM Reproducibility Package v1.0.2' \
            --notes-file release-notes.md \
            --verify-tag=false
